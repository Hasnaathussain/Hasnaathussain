<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="title description">
  <title id="title">Hasnaat Hussain — AI systems and data infrastructure</title>
  <desc id="description">A midnight-blue profile header with a violet-to-coral accent and a terminal-style HH monogram.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827" />
      <stop offset="1" stop-color="#1b2134" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a8cff" />
      <stop offset="1" stop-color="#ff9b78" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8c2d8" stroke-opacity=".08" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="276" rx="18" fill="url(#surface)" />
  <rect width="1200" height="276" rx="18" fill="url(#grid)" />
  <rect width="7" height="276" rx="3.5" fill="url(#accent)" />
  <path d="M744 0v276" stroke="#c3cbe0" stroke-opacity=".15" />

  <text x="54" y="56" fill="#b9c3d8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2.2">AI SYSTEMS  /  RELIABILITY</text>
  <text x="52" y="126" fill="#f4f2f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="700" letter-spacing="1.5">HASNAAT HUSSAIN</text>
  <rect x="56" y="151" width="82" height="3" rx="1.5" fill="url(#accent)" />
  <text x="54" y="190" fill="#d5daea" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Model serving · retrieval · data reliability</text>
  <text x="55" y="235" fill="#aab4ca" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.3">REPRODUCE  /  FIX  /  VERIFY</text>

  <text x="790" y="58" fill="#c0c9dc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">ENGINEERING NOTES</text>
  <rect x="786" y="74" width="354" height="151" rx="12" fill="#111827" fill-opacity=".74" stroke="#aab4ca" stroke-opacity=".24" />
  <text x="824" y="111" fill="#ff9b78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">+-----------+</text>
  <text x="824" y="139" fill="#eceaf4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">| H       H |</text>
  <text x="824" y="167" fill="#eceaf4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">|  HHHHHHH  |</text>
  <text x="824" y="195" fill="#eceaf4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">| H       H |</text>
  <text x="824" y="219" fill="#ff9b78" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">+-----------+</text>
  <text x="786" y="255" fill="#b9c3d8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.3">INFERENCE  ·  DATA  ·  TOOLS</text>
</svg>
